name: mate_couple_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  geolocator: ^12.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/affiliate/eat.jpg
    - assets/images/affiliate/play.jpg
    - assets/images/affiliate/movie.jpg
    - assets/images/affiliate/gift.jpg
    - assets/images/shop/shop.jpg
    - assets/images/shop/lucky.jpg
    - assets/images/shop/daily.jpg
    - assets/images/shop/inventory.jpg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

